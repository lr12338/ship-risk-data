# =========================
# Kafka
# =========================
kafka.bootstrap.servers=192.168.99.92:9092
#kafka.bootstrap.servers=localhost:9092
kafka.group.id=portcall-group
#kafka.group.id=portcall-group
kafka.topic=LIVE_RECENTSHIPS_DATA
#kafka.topic=flink_aisdata_topic


kafka.stop-point.topic=RELIABLE_STOP_POINTS
kafka.client.id=portcall-consumer-1

# =========================
# Pipeline Runtime
# =========================
pipeline.reorder.max-lateness-seconds=100
pipeline.reorder.max-points-per-vessel=200
pipeline.dedup.cache-size=8192
pipeline.jump-point.max-implied-speed-knots=45.0
pipeline.accepted-data-states=normal

# =========================
# Stop Candidate / Stable Stop
# =========================
stop-point.max-speed-knots=1.0
stop-point.end-speed-knots=2.0

stop.candidate.min-duration-seconds=300
stop.candidate.min-point-count=3
stop.candidate.max-net-displacement-meters=500.0

stop.stable.min-duration-seconds=600
stop.stable.min-point-count=5
stop.stable.max-speed-knots=0.5
stop.stable.max-radius-meters=100.0
stop.stable.center-delta-meters=30.0
stop.position.outlier-radius-meters=150.0

resume.min-duration-seconds=180
resume.leave-radius-meters=300.0

# =========================
# Throttled Output
# =========================
output.stop-update.min-interval-seconds=300
output.stop-update.min-position-delta-meters=30.0
output.stop-update.min-confidence-delta=0.05
output.unknown.timeout-seconds=1800

# =========================
# Flink Runtime
# =========================
flink.checkpoint.interval-ms=180000
flink.state.backend=rocksdb
# Checkpoint / savepoint retention (days). Cancelled-job checkpoints are kept (RETAIN_ON_CANCELLATION).
# Flink 1.16 retains by checkpoint count: auto = retention-days * 86400 / interval-seconds.
flink.checkpoint.retention-days=7
flink.savepoint.retention-days=7
# 0 = auto from retention-days; set 1-3 if checkpoint cleanup slows the job
flink.checkpoint.max-retained=3
# Checkpoint / savepoint storage (HDFS/S3/shared NFS in production; configure 15-day lifecycle on storage)
flink.checkpoint.dir=file:///data/flink/checkpoints
flink.savepoint.dir=file:///data/flink/savepoints
# RocksDB working directory on each TaskManager
flink.rocksdb.localdir=/data/flink/rocksdb
# Job parallelism (0 = use cluster default)
flink.parallelism=12
flink.debug.print=false
# Windows local example:
#flink.checkpoint.dir=file:///D:/flink-data/checkpoints
#flink.savepoint.dir=file:///D:/flink-data/savepoints
#flink.rocksdb.localdir=D:/flink-data/rocksdb

# =========================
# AIS Raw Archive Tool
# =========================
# Consumes raw AIS Kafka records and writes JSONL archive files for later replay.
archive.source.topic=${kafka.topic}
archive.group.id=ais-archive-group
archive.client.id=ais-archive-consumer
archive.output.dir=data/ais-history
archive.rollover=hourly
# updatetime / kafka_timestamp / archive_time
archive.partition-time-field=updatetime
archive.poll.timeout-ms=1000
archive.flush-record-count=1000
# 0 = run continuously
archive.max-records=0
# latest is recommended for long-running online archive; earliest can be used for one-off backfill.
archive.auto.offset.reset=latest

# =========================
# AIS Replay Tool
# =========================
# Reads archived JSONL files and writes raw AIS values into a replay Kafka topic.
replay.input.dir=data/ais-history
replay.target.topic=AIS_REPLAY_DEFAULT
replay.client.id=ais-replay-producer
# Empty means no boundary. Supported format: 2026-06-30T00:00:00Z or 2026-06-30 00:00:00.
replay.start-time=
replay.end-time=
# archive-key / mmsi / null
replay.key-mode=archive-key
# 0 = no throttle
replay.max-records-per-second=0
replay.dry-run=false
