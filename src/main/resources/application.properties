# =========================
# Kafka
# =========================
kafka.bootstrap.servers=192.168.99.92:9092
#kafka.bootstrap.servers=localhost:9092
kafka.group.id=portcall-group
#kafka.group.id=portcall-group
kafka.topic=LIVE_RECENTSHIPS_DATA
#kafka.topic=flink_aisdata_topic


kafka.stop-point.topic=RELIABLE_STOP_POINTS
kafka.alongside.topic=RELIABLE_ALONGSIDE_EVENTS
kafka.client.id=portcall-consumer-1
kafka.starting-offsets=committed

# =========================
# Pipeline Runtime
# =========================
pipeline.reorder.max-lateness-seconds=100
pipeline.reorder.max-points-per-vessel=50
pipeline.dedup.cache-size=1024
pipeline.dedup.ttl-hours=6
pipeline.state.idle-ttl-hours=48
pipeline.jump-point.max-implied-speed-knots=45.0
pipeline.accepted-data-states=normal
# Optional scope filter for local live validation or regional canaries.
# Empty values mean no additional scope filter.
pipeline.scope.mmsi-whitelist=
pipeline.scope.min-lon=
pipeline.scope.max-lon=
pipeline.scope.min-lat=
pipeline.scope.max-lat=

# =========================
# Stop Candidate / Stable Stop
# =========================
stop-point.max-speed-knots=1.0
stop-point.end-speed-knots=2.0

stop.candidate.min-duration-seconds=300
stop.candidate.min-point-count=3
stop.candidate.max-net-displacement-meters=500.0

stop.stable.min-duration-seconds=600
stop.stable.min-point-count=5
stop.stable.max-speed-knots=0.5
stop.stable.max-radius-meters=100.0
stop.stable.center-delta-meters=30.0
stop.position.outlier-radius-meters=150.0

resume.min-duration-seconds=180
resume.leave-radius-meters=300.0

# =========================
# Throttled Output
# =========================
output.stop-update.min-interval-seconds=300
output.stop-update.min-position-delta-meters=30.0
output.stop-update.min-confidence-delta=0.05
output.unknown.timeout-seconds=1800

# =========================
# Realtime Alongside Detection
# =========================
# Keep disabled by default so existing stop-point production behavior is unchanged.
alongside.enabled=false
alongside.output.topic=RELIABLE_ALONGSIDE_EVENTS
alongside.rule-version=ALONGSIDE_V2_INSURANCE
alongside.spatial.bucket-size-degrees=0.02

alongside.pre-filter.enabled=true
alongside.pre-filter.max-speed=4.0
alongside.pre-filter.exclude-invalid-mmsi=true

alongside.ship-type-filter.enabled=false
alongside.ship-type.high-priority=TANKER,CHEMICAL_TANKER,LNG,LPG,CARGO,BULK_CARRIER,CONTAINER,REEFER,FISH_CARRIER,BUNKER,SUPPLY,OFFSHORE_SUPPLY,UNKNOWN
alongside.ship-type.normal-service=TUG,PILOT,LAW_ENFORCEMENT,SAR,PORT_SERVICE,DREDGER,WORKBOAT
alongside.ship-type.low-priority=PLEASURE_CRAFT,SAILING,LOCAL_PASSENGER

alongside.candidate.max-distance-nm=0.5
alongside.candidate.max-speed=4.0
alongside.candidate.max-speed-knots=4.0
alongside.candidate.max-time-gap-minutes=10
alongside.candidate.min-points=3
alongside.candidate.min-duration-minutes=20

alongside.confirm.max-distance-nm=0.15
alongside.confirm.max-speed=2.0
alongside.confirm.max-speed-knots=2.0
alongside.confirm.max-relative-speed=1.0
alongside.confirm.max-relative-speed-knots=1.0
alongside.confirm.max-time-gap-minutes=10
alongside.confirm.high-confidence-time-gap-minutes=5
alongside.confirm.min-duration-minutes=30
alongside.confirm.min-points=6

alongside.heading.enabled=true
alongside.heading.parallel-threshold-degree=30
alongside.heading.parallel-threshold-degrees=30
alongside.merge.enabled=true
alongside.merge.max-gap-minutes=30
alongside.merge.max-center-distance-nm=1.0
alongside.ais-gap-minutes=30
alongside.state.ttl-hours=48
alongside.state.bucket-point-ttl-minutes=15
alongside.state.pair-ttl-minutes=120
alongside.state.ended-pair-ttl-hours=6
alongside.scene.nav-status-downgrade.enabled=true
alongside.scene.no-scene-data.max-level=L2
alongside.scene.auto-l4-enabled=false
alongside.severity-cap.no-scene-data.max-level=L2
alongside.scene-data.available=false
alongside.counterparty-risk.available=false
alongside.auto-l4-enabled=false
alongside.output.update-interval-minutes=5
alongside.metrics.enabled=true

# =========================
# Alongside Realtime DB Sink
# =========================
alongside.db-sink.enabled=false
alongside.db-sink.detail-enabled=true
alongside.db-sink.url=
alongside.db-sink.username=
alongside.db-sink.password=
alongside.db-sink.batch-size=100
alongside.db-sink.flush-interval-ms=3000
alongside.db-sink.max-retries=3
alongside.db-sink.table-event=ship_realtime_alongside_event
alongside.db-sink.table-detail=ship_realtime_alongside_event_detail
alongside.db-sink.max-detail-points-per-event=200
alongside.db-sink.auto-create-table=true
# Empty means all severity levels are written. Example: L2 writes only L2 events to DB.
alongside.db-sink.allowed-severity-levels=

# =========================
# Flink Runtime
# =========================
flink.checkpoint.interval-ms=180000
flink.state.backend=rocksdb
# Checkpoint retention: keep disk bounded for large RocksDB state.
# max-retained=1 keeps only the latest completed checkpoint while the job runs.
# externalized-cleanup=DELETE_ON_CANCELLATION avoids leaving old jobId checkpoint directories after a normal cancel.
flink.checkpoint.retention-days=7
flink.savepoint.retention-days=7
flink.checkpoint.max-retained=1
flink.checkpoint.incremental=true
flink.checkpoint.min-pause-ms=60000
flink.checkpoint.timeout-ms=300000
flink.checkpoint.externalized-cleanup=DELETE_ON_CANCELLATION
# Checkpoint / savepoint storage (HDFS/S3/shared NFS in production; configure 15-day lifecycle on storage)
flink.checkpoint.dir=file:///data/flink/checkpoints
flink.savepoint.dir=file:///data/flink/savepoints
# RocksDB working directory on each TaskManager
flink.rocksdb.localdir=/data/flink/rocksdb
# Job parallelism (0 = use cluster default)
flink.parallelism=12
flink.debug.print=false
# Windows local example:
#flink.checkpoint.dir=file:///D:/flink-data/checkpoints
#flink.savepoint.dir=file:///D:/flink-data/savepoints
#flink.rocksdb.localdir=D:/flink-data/rocksdb

# =========================
# AIS Raw Archive Tool
# =========================
# Consumes raw AIS Kafka records and writes JSONL archive files for later replay.
archive.source.topic=LIVE_RECENTSHIPS_DATA
archive.group.id=ais-archive-group
archive.client.id=ais-archive-consumer
archive.output.dir=F://data//ais-history
archive.rollover=hourly
# updatetime / kafka_timestamp / archive_time
archive.partition-time-field=updatetime
archive.poll.timeout-ms=1000
archive.flush-record-count=1000
# 0 = run continuously
archive.max-records=0
# latest is recommended for long-running online archive; earliest can be used for one-off backfill.
archive.auto.offset.reset=latest

# =========================
# AIS Replay Tool
# =========================
# Reads archived JSONL files and writes raw AIS values into a replay Kafka topic.
replay.input.dir=data/ais-history
replay.target.topic=AIS_REPLAY_DEFAULT
replay.client.id=ais-replay-producer
# Empty means no boundary. Supported format: 2026-06-30T00:00:00Z or 2026-06-30 00:00:00.
replay.start-time=
replay.end-time=
# archive-key / mmsi / null
replay.key-mode=archive-key
# 0 = no throttle
replay.max-records-per-second=0
replay.dry-run=false
