schemaName.taipySchemaName=taipy_dev

spring.datasource.wgq111.pg.url=${DB_WGQ111_PG_URL}
spring.datasource.wgq111.pg.username=${DB_WGQ111_PG_USERNAME}
spring.datasource.wgq111.pg.password=${DB_WGQ111_PG_PASSWORD}
spring.datasource.wgq111.pg.driver-class-name=org.postgresql.Driver
spring.datasource.wgq111.pg.test-while-idle=true
spring.datasource.wgq111.pg.test-on-return=false
spring.datasource.wgq111.pg.validation-query=SELECT 1
spring.datasource.wgq111.pg.time-between-eviction-runs-millis=300000
spring.datasource.wgq111.pg.min-evictable-idle-time-millis=1800000
spring.datasource.wgq111.pg.min-idle=2

