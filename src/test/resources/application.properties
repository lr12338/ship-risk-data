# Test-only config; overrides src/main/resources for unit tests.
kafka.bootstrap.servers=localhost:9092
kafka.group.id=portcall-group
kafka.topic=flink_aisdata_topic
kafka.stop-point.topic=RELIABLE_STOP_POINTS
kafka.client.id=portcall-consumer-1

pipeline.reorder.max-lateness-seconds=600
pipeline.reorder.max-points-per-vessel=200
pipeline.dedup.cache-size=8192
pipeline.jump-point.max-implied-speed-knots=45.0
pipeline.accepted-data-states=normal

stop-point.max-speed-knots=1.0
stop-point.end-speed-knots=2.0
stop.candidate.min-duration-seconds=300
stop.candidate.min-point-count=3
stop.candidate.max-net-displacement-meters=500.0
stop.stable.min-duration-seconds=600
stop.stable.min-point-count=5
stop.stable.max-speed-knots=0.5
stop.stable.max-radius-meters=100.0
stop.stable.center-delta-meters=30.0
stop.position.outlier-radius-meters=150.0
resume.min-duration-seconds=180
resume.leave-radius-meters=300.0
output.stop-update.min-interval-seconds=300
output.stop-update.min-position-delta-meters=30.0
output.stop-update.min-confidence-delta=0.05
output.unknown.timeout-seconds=1800
flink.checkpoint.interval-ms=60000
flink.checkpoint.retention-days=15
flink.savepoint.retention-days=15
flink.checkpoint.max-retained=1
flink.state.backend=rocksdb
flink.checkpoint.dir=file:///tmp/flink-test/checkpoints
flink.savepoint.dir=file:///tmp/flink-test/savepoints
flink.rocksdb.localdir=/tmp/flink-test/rocksdb
