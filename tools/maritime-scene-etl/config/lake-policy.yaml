schema_version: 1
areaField: Lake_area
minAreaKm2: 50
boundaryToleranceMeters: 1000
confidencePolicy:
  interior: HIGH
  boundary: BOUNDARY_UNCERTAIN
  invalidGeometry: UNKNOWN
retainReservoirs: true
