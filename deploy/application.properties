# 区域进出事件落库
zone.crossing.store.enabled=true
zone.crossing.store.batch-size=500

# 区域通行分析（88000+ 船舶建议 parallelism=4，按机器资源调整）
zone.passage.parallelism=4
zone.passage.progress-interval=200
zone.passage.status.batch-size=50
# HBase DP 抽稀 zoom（getVoffersFromHbase）；8~9 为批量计算推荐区间，≤0 不抽稀
zone.passage.trajectory.simplify-zoom=9
zone.passage.backfill.from-date=2025-01-01
zone.passage.backfill.to-date=2026-07-01

# 5万商船行为生产测试
ship.behavior.trajectory.simplify-zoom=15
ship.behavior.loitering.production.max-points-per-ship=200000
# 未完成港区10海里、锚地、泊位和STS场景验收前必须保持 false
ship.behavior.loitering.production.scene-ready=false

# 生产事件轨迹回溯接口：默认关闭；token 必须在服务器外置配置中设置
ship.behavior.trace.replay.enabled=false
ship.behavior.trace.replay.token=
ship.behavior.trace.replay.max-days=7
ship.behavior.trace.replay.max-points=100000
ship.behavior.trace.replay.concurrent-requests=2

